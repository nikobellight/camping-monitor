name: Camping Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check availability
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import requests, smtplib
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os

          GMAIL_SENDER = "nikobellight@gmail.com"
          GMAIL_PASSWORD = os.environ["GMAIL_PASSWORD"]
          NOTIFY_EMAIL = "nikobellight@gmail.com"
          BOOK_URL = "https://santabarbara.camava.com/reservation/camping/index.asp"

          PARKS = [
              {"name": "Cachuma Lake"},
              {"name": "Jalama Beach"},
          ]

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
          }

          def send_email(park_name):
              msg = MIMEMultipart("alternative")
              msg["Subject"] = f"Camping available! {park_name} Jun 12"
              msg["From"] = GMAIL_SENDER
              msg["To"] = NOTIFY_EMAIL
              body = f"""<html><body>
              <h2>Campsite available!</h2>
              <p><b>{park_name}</b> – Hookup Partial – Jun 12</p>
              <a href='{BOOK_URL}' style='background:#2a7a4b;color:white;padding:12px 24px;text-decoration:none;border-radius:6px;'>Book now</a>
              </body></html>"""
              msg.attach(MIMEText(body, "html"))
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
                  s.login(GMAIL_SENDER, GMAIL_PASSWORD)
                  s.sendmail(GMAIL_SENDER, NOTIFY_EMAIL, msg.as_string())
              print(f"Alert sent for {park_name}!")

          try:
              resp = requests.get(BOOK_URL, headers=HEADERS, timeout=20)
              page = resp.text.lower()
              print(f"Page fetched OK, length: {len(page)}")
              for park in PARKS:
                  park_key = park["name"].lower().split()[0]
                  found = park_key in page and "hookup" in page and "partial" in page
                  if found:
                      print(f"AVAILABILITY FOUND: {park['name']}")
                      send_email(park["name"])
                  else:
                      print(f"No availability: {park['name']}")
          except Exception as e:
              print(f"Error: {e}")
          EOF
