name: Camping Monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check availability
        env:
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
        run: |
          python3 - <<'EOF'
          import requests, smtplib, re
          from email.mime.text import MIMEText
          from email.mime.multipart import MIMEMultipart
          import os

          GMAIL_SENDER = "nikobellight@gmail.com"
          GMAIL_PASSWORD = os.environ["GMAIL_PASSWORD"]
          NOTIFY_EMAIL = "nikobellight@gmail.com"
          BOOK_URL = "https://santabarbara.camava.com/reservation/camping/index.asp"

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
              "Referer": "https://santabarbara.camava.com/reservation/camping/index.asp",
              "Content-Type": "application/x-www-form-urlencoded",
          }

          SEARCHES = [
              {"park": "Cachuma Lake", "park_id": "1", "nights": "2"},
              {"park": "Jalama Beach",  "park_id": "2", "nights": "1"},
              {"park": "Jalama Beach",  "park_id": "2", "nights": "2"},
          ]

          def send_email(park_name, nights, sites):
              msg = MIMEMultipart("alternative")
              msg["Subject"] = f"Camping available! {park_name} Jun 12"
              msg["From"] = GMAIL_SENDER
              msg["To"] = NOTIFY_EMAIL
              sites_html = "".join(f"<li>{s}</li>" for s in sites)
              body = f"""<html><body style='font-family:sans-serif'>
              <h2 style='color:#2a7a4b'>Campsite available!</h2>
              <p><b>{park_name}</b> - Hookup Partial - Jun 12 ({nights} night{'s' if int(nights)>1 else ''})</p>
              <p>Available sites:<ul>{sites_html}</ul></p>
              <a href='{BOOK_URL}' style='background:#2a7a4b;color:white;padding:12px 24px;
              text-decoration:none;border-radius:6px;display:inline-block;margin-top:8px'>
              Book now</a>
              <p style='color:#999;font-size:12px'>Act fast - sites go quickly!</p>
              </body></html>"""
              msg.attach(MIMEText(body, "html"))
              with smtplib.SMTP_SSL("smtp.gmail.com", 465) as s:
                  s.login(GMAIL_SENDER, GMAIL_PASSWORD)
                  s.sendmail(GMAIL_SENDER, NOTIFY_EMAIL, msg.as_string())
              print(f"  Alert email sent for {park_name}!")

          session = requests.Session()

          for search in SEARCHES:
              try:
                  data = {
                      "park": search["park_id"],
                      "arrdate": "06/12/2026",
                      "nights": search["nights"],
                      "sitetype": "Hookup - Partial",
                  }
                  resp = session.post(BOOK_URL, headers=HEADERS, data=data, timeout=20)
                  page = resp.text

                  site_numbers = re.findall(r'Site:\s*(\d+)', page)
                  has_results = bool(site_numbers)

                  if has_results:
                      sites_found = [f"Site {n}" for n in site_numbers]
                      print(f"  AVAILABILITY FOUND: {search['park']} ({search['nights']} nights) - Sites: {sites_found}")
                      send_email(search["park"], search["nights"], sites_found)
                  else:
                      print(f"  No availability: {search['park']} ({search['nights']} nights)")

              except Exception as e:
                  print(f"  Error checking {search['park']}: {e}")
          EOF
